<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/odcc.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      اسکریپت درون‌خطی، lang و dir را قبل از اولین رنگ‌پردازی تنظیم می‌کند تا
      چشمک جهت اشتباه (FOUC) رخ ندهد. فرهنگ از مسیر فعلی خوانده می‌شود.
      تم نیز از تنظیم ذخیره‌شده (یا ترجیح سیستمی) خوانده و اعمال می‌شود
      تا چشمک تم اشتباه رخ ندهد.
    -->
    <script>
      (function () {
        var path = window.location.pathname || '/';
        var match = path.match(/^\/(fa|en)(?:\/|$)/);
        var culture = match ? match[1] : (localStorage.getItem('odcc.survey.culture') || 'fa');
        var html = document.documentElement;
        html.lang = culture;
        html.dir = culture === 'fa' ? 'rtl' : 'ltr';

        var storedTheme = null;
        try {
          storedTheme = localStorage.getItem('odcc.survey.theme');
        } catch (e) {}
        var knownThemes = ['light', 'dark', 'green'];
        var prefersDark = false;
        try {
          prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {}
        var theme = knownThemes.indexOf(storedTheme) !== -1
          ? storedTheme
          : (prefersDark ? 'dark' : 'light');
        html.classList.remove('dark', 'green');
        if (theme === 'dark' || theme === 'green') {
          html.classList.add(theme);
        }
        // تم سبز هم مانند تاریک، یک تم تیره است: کنترل‌های بومیِ تیره.
        html.style.colorScheme = theme === 'light' ? 'light' : 'dark';
      })();
    </script>

    <!-- فونت وزیرمتن (فارسی، OFL) و Inter (انگلیسی) از CDN -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
    />
    <title>سامانه مدیریت نظرسنجی</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
